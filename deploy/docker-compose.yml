services:
  db:
    image: postgres:16-alpine
    container_name: obedar-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: obedar
      POSTGRES_USER: obedar
      POSTGRES_PASSWORD: ${DB_HESLO}
    volumes:
      - ./data/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U obedar"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: ../app
    container_name: obedar-app
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://obedar:${DB_HESLO}@db:5432/obedar
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_MENO: ${SMTP_MENO}
      SMTP_HESLO: ${SMTP_HESLO}
      SMTP_OD: ${SMTP_OD:-obedy@ahafarma.sk}
      SMTP_EHLO: ${SMTP_EHLO:-obedy.ahafarma.sk}
      ADRESA: ${ADRESA}
      VERZIA: ${VERZIA:-neznáma}
      # Bez pásma beží kontajner v UTC a denná uzávierka o 07:30 by v lete
      # nastala až o 09:30 nášho času.
      TZ: ${TZ:-Europe/Bratislava}
    # Len na slučku. Caddy chodí na appku vnútornou sieťou; tento port je preto,
    # aby sa dalo zo servera overiť /zdravie — presne to robí deploy.sh po nasadení.
    ports: ["127.0.0.1:3000:3000"]
    volumes:
      - ./data/prilohy:/data/prilohy

  # ---------- testovacia kópia (07-nasadenie, bod 3) ----------
  #
  # Tá istá appka, iná databáza, iný port. Púšťa sa zvlášť:
  #
  #     ./test-kopia.sh
  #
  # Bežné nasadenie sa jej nedotkne — `profiles` znamená, že bez menovitého
  # vyžiadania tieto služby neexistujú. Preto ju `deploy.sh` ani nezhodí, ani
  # neprestaví: na test sa skúša *nová* verzia, kým na ostrej beží stará.
  db-test:
    image: postgres:16-alpine
    container_name: obedar-db-test
    profiles: ["test"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: obedar
      POSTGRES_USER: obedar
      POSTGRES_PASSWORD: ${DB_HESLO}
    volumes:
      - ./data/db-test:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U obedar"]
      interval: 10s
      timeout: 5s
      retries: 5

  app-test:
    build: ../app
    container_name: obedar-app-test
    profiles: ["test"]
    restart: unless-stopped
    depends_on:
      db-test: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://obedar:${DB_HESLO}@db-test:5432/obedar
      # SMTP tu zámerne nie je. Testovacia kópia nesmie poslať e-mail —
      # inak sa raz stane, že kuchyňa uvarí podľa skúšobnej objednávky.
      # Appka to povie rovno na uzávierke a znenie správy si prečítaš aj tak.
      ADRESA: ${ADRESA_TEST:-http://localhost:8080}
      VERZIA: ${VERZIA:-neznáma}-TEST
      # Bez `production` nemá prihlasovacia cookie príznak Secure, takže
      # testovacia kópia funguje aj cez obyčajné http v tuneli cez SSH.
      NODE_ENV: test
      TZ: ${TZ:-Europe/Bratislava}
    ports: ["127.0.0.1:3010:3000"]
    volumes:
      - ./data/prilohy-test:/data/prilohy

  caddy:
    image: caddy:2-alpine
    container_name: obedar-caddy
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      # Kým nie je vyplnená, Caddy testovaciu kópiu nikam nevystaví a ani si
      # na ňu nepýta certifikát. Vyplní sa až vtedy, keď na ňu ukazuje DNS.
      #
      # Náhrada musí byť tu, nie len v Caddyfile. `${TEST_DOMENA:-}` by
      # premennú nastavilo na **prázdny reťazec** — a to nie je to isté ako
      # nenastavená: Caddy vtedy svoju náhradu `{$TEST_DOMENA:...}` nepoužije,
      # dosadí prázdno a ostane mu blok bez adresy. Taký súbor odmietne celý
      # a s ním padne aj ostrá stránka. (Stalo sa 15. 8. 2026.)
      TEST_DOMENA: ${TEST_DOMENA:-http://127.0.0.1:9999}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Preview sa vozí priamo z repozitára — po git pull je hneď aktuálne
      # a odpadá kopírovanie súboru na server ručne.
      - ../preview:/srv:ro
      - ./data/caddy:/data
      - ./data/zalohy:/zalohy:ro
