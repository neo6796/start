# Zatiaľ jeden kontajner. Keď pribudne ostrá appka, pridajú sa sem
# služby "app" a "db" a Caddyfile sa zmení z file_server na reverse_proxy.

services:
  caddy:
    image: caddy:2-alpine
    container_name: obedar-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
